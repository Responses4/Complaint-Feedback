{% extends 'complaints/base.html' %}

{% block content %}
<h1>Complaint detail</h1>

<div class="card">
    <p><strong>Name:</strong> {{ complaint.name }}</p>
    <p><strong>Message:</strong> {{ complaint.message }}</p>

    <hr>

    <h3>Reply</h3>
    {% if complaint.reply %}
        <p class="reply">{{ complaint.reply }}</p>
    {% else %}
        <p class="no-reply">No reply yet</p>
    {% endif %}
</div>

<a href="{% url 'complaints:complaint_list' %}" class="back-link">← Back</a>
{% endblock %}
